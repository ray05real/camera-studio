# The Xcode project is made from this file on GitHub's Mac (XcodeGen), so it can be written on Windows.
name: CameraStudio
options:
  bundleIdPrefix: com.ray05real
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  CameraStudio:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ray05real.camerastudio
        PRODUCT_NAME: CameraStudio
        SWIFT_OBJC_BRIDGING_HEADER: App/CameraStudio-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Config/App-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Camera Studio"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
